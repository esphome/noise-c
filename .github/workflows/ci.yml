name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    name: Tests (${{ matrix.compiler }}, ${{ matrix.libsodium }} libsodium)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        libsodium: [fork, system]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the system libsodium
        if: matrix.libsodium == 'system'
        run: |
          # The runner image carries a Google Chrome source that has served
          # mismatched indexes; nothing here needs it
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libmbedtls-dev pkg-config
      - name: Configure against ESPHome's libsodium fork
        if: matrix.libsodium == 'fork'
        run: cmake -S . -B build -DNOISE_C_BUILD_TESTS=ON -DCMAKE_C_COMPILER=${{ matrix.compiler }}
      - name: Configure as a subdirectory of another project, against the system libsodium
        if: matrix.libsodium == 'system'
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          printf 'cmake_minimum_required(VERSION 3.13)\nproject(consumer C)\nenable_testing()\nadd_subdirectory("%s" noise-c)\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/consumer/CMakeLists.txt"
          cmake -S "$RUNNER_TEMP/consumer" -B build -DNOISE_C_BUILD_TESTS=ON -DNOISE_C_FIND_LIBSODIUM=ON -DCMAKE_C_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test with SHA256 hashed through the system mbedTLS
        if: matrix.libsodium == 'system'
        run: |
          cmake -S . -B build-mbedtls -DNOISE_C_BUILD_TESTS=ON -DNOISE_C_FIND_LIBSODIUM=ON -DNOISE_C_MBEDTLS_SHA256=ON -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          cmake --build build-mbedtls --parallel
          ctest --test-dir build-mbedtls --output-on-failure --no-tests=error
      - name: Test the same through PSA, the path mbedTLS 4 takes
        if: matrix.libsodium == 'system'
        run: |
          cmake -S . -B build-psa -DNOISE_C_BUILD_TESTS=ON -DNOISE_C_FIND_LIBSODIUM=ON -DNOISE_C_MBEDTLS_SHA256=ON -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_C_FLAGS=-DNOISE_SHA256_VIA_PSA
          cmake --build build-psa --parallel
          ctest --test-dir build-psa --output-on-failure --no-tests=error
      - name: Build the library alone with the tests off
        if: matrix.libsodium == 'system'
        run: |
          cmake -S . -B build-lib -DNOISE_C_FIND_LIBSODIUM=ON -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          cmake --build build-lib --parallel
      - name: Test the way the microcontroller builds are configured, switches off
        if: matrix.libsodium == 'fork'
        run: |
          cmake -S . -B build-small -DNOISE_C_BUILD_TESTS=ON -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_C_FLAGS="-DNOISE_USE_PROTOCOL_NAME_TABLE=0 -DNOISE_USE_FALLBACK=0 -DNOISE_USE_HFS=0"
          cmake --build build-small --parallel
          # Only the tests that do not name protocols other than the one left
          build-small/noise-c-test-unit small_build single_protocol cipherstate dhstate errors hashstate randstate
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
